<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winomation - Visual Windows Automation</title>
    <meta name="description" content="Winomation is a visual Windows automation builder. Build powerful automations visually without writing code, leveraging Node.js and AutoHotkey.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
        
        body {
            background-color: #0d0d0e;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .video-container {
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            overflow: hidden;
            background: #1C1C1F;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<div class="video-container">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Drop shadows for Glassmorphism &amp; Elevation -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
            </filter>
            
            <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1C1C1F" />
                <stop offset="100%" stop-color="#121214" />
            </linearGradient>

            <linearGradient id="primary-grad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#6F00FF" />
                <stop offset="100%" stop-color="#9D4DFF" />
            </linearGradient>

            <clipPath id="window-header">
                <rect x="0" y="0" width="300" height="40" rx="12" />
            </clipPath>
            
            <clipPath id="node-bar">
                <rect x="0" y="0" width="12" height="90" rx="6" />
            </clipPath>

            <!-- Background Grid Pattern -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2E3036" stroke-width="0.5"/>
            </pattern>
        </defs>

        <style>
            /* Infintely Looping 24s Timeline */
            @keyframes s1_anim {
                0% { opacity: 0; transform: translateY(20px); pointer-events: none; }
                3%, 22% { opacity: 1; transform: translateY(0); pointer-events: auto; }
                25%, 100% { opacity: 0; transform: translateY(-20px); pointer-events: none; }
            }
            @keyframes s2_anim {
                0%, 22% { opacity: 0; transform: translateY(20px); pointer-events: none; }
                25%, 47% { opacity: 1; transform: translateY(0); pointer-events: auto; }
                50%, 100% { opacity: 0; transform: translateY(-20px); pointer-events: none; }
            }
            @keyframes s3_anim {
                0%, 47% { opacity: 0; transform: translateY(20px); pointer-events: none; }
                50%, 72% { opacity: 1; transform: translateY(0); pointer-events: auto; }
                75%, 100% { opacity: 0; transform: translateY(-20px); pointer-events: none; }
            }
            @keyframes s4_anim {
                0%, 72% { opacity: 0; transform: translateY(20px); pointer-events: none; }
                75%, 97% { opacity: 1; transform: translateY(0); pointer-events: auto; }
                100% { opacity: 0; transform: translateY(-20px); pointer-events: none; }
            }

            .scene1 { animation: s1_anim 12s infinite cubic-bezier(0.25, 1, 0.5, 1); opacity: 0; }
            .scene2 { animation: s2_anim 12s infinite cubic-bezier(0.25, 1, 0.5, 1); opacity: 0; }
            .scene3 { animation: s3_anim 12s infinite cubic-bezier(0.25, 1, 0.5, 1); opacity: 0; }
            .scene4 { animation: s4_anim 12s infinite cubic-bezier(0.25, 1, 0.5, 1); opacity: 0; }

            /* Micro-Animations */
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-10px); }
            }
            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 0.9; }
                50% { transform: scale(1.05); opacity: 1; }
            }
            @keyframes dash {
                0% { stroke-dashoffset: 20; }
                100% { stroke-dashoffset: 0; }
            }
            @keyframes rotateOuter {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .floating-box { animation: float 6s infinite ease-in-out; }
            .pulsing-item { animation: pulse 2.5s infinite ease-in-out; transform-origin: center; }
            .flow-line { stroke-dasharray: 10; animation: dash 1s linear infinite; }
            .rotate-ring { animation: rotateOuter 15s linear infinite; transform-origin: center; }
            .text-mono { font-family: monospace; }
        </style>

        <!-- Base Backgrounds -->
        <rect width="1200" height="800" fill="url(#bg-grad)" />
        <rect width="1200" height="800" fill="url(#grid)" />

        <!-- SCENE 1: The Hook -->
        <!-- Fixed nested transform architecture per SOP to prevent CSS bugs -->
        <g transform="translate(0, 0)">
            <g class="scene1">
                <!-- Title Text -->
                <g transform="translate(600, 200)">
                    <text text-anchor="middle" font-family="Inter" font-weight="800" font-size="52" fill="#F8F9FA" letter-spacing="-1">Tired of repetitive Windows tasks?</text>
                    <text text-anchor="middle" y="45" font-family="Inter" font-weight="400" font-size="24" fill="#F8F9FA" opacity="0.6">Writing complex scripts and batch files is tedious.</text>
                </g>

                <!-- Floating Code Elements -->
                <g transform="translate(200, 350)">
                    <g class="floating-box" style="animation-delay: 0s;">
                        <rect width="300" height="180" fill="#23242A" rx="12" filter="url(#shadow)" stroke="#343741" stroke-width="1"/>
                        <rect x="0" y="0" width="300" height="40" fill="#16171A" rx="12" clip-path="url(#window-header)"/>
                        <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
                        <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
                        <circle cx="60" cy="20" r="5" fill="#27c93f"/>
                        <text x="80" y="24" font-family="Inter" font-weight="600" font-size="12" fill="#F8F9FA" opacity="0.6">script.ahk</text>
                        
                        <text class="text-mono" x="20" y="70" font-size="14" fill="#9D4DFF" font-weight="600">^!s::</text>
                        <text class="text-mono" x="40" y="95" font-size="14" fill="#E2E8F0">Send, ^c</text>
                        <text class="text-mono" x="40" y="120" font-size="14" fill="#E2E8F0">Sleep, 100</text>
                        <text class="text-mono" x="40" y="145" font-size="14" fill="#E2E8F0">Run, notepad.exe</text>
                    </g>
                </g>

                <g transform="translate(650, 420)">
                    <g class="floating-box" style="animation-delay: 0.8s;">
                        <rect width="280" height="150" fill="#23242A" rx="12" filter="url(#shadow)" stroke="#343741" stroke-width="1"/>
                        <rect x="0" y="0" width="280" height="40" fill="#16171A" rx="12" clip-path="url(#window-header)"/>
                        <text x="20" y="24" font-family="Inter" font-weight="600" font-size="12" fill="#F8F9FA" opacity="0.6">automation.bat</text>
                        
                        <text class="text-mono" x="20" y="70" font-size="14" fill="#E2E8F0">@echo off</text>
                        <text class="text-mono" x="20" y="95" font-size="14" fill="#E2E8F0">taskkill /f /im task.exe</text>
                        <text class="text-mono" x="20" y="120" font-size="14" fill="#E2E8F0">echo Done!</text>
                    </g>
                </g>

                <!-- Error Toast -->
                <g transform="translate(480, 520)">
                    <g class="floating-box" style="animation-delay: 1.5s;">
                        <rect width="240" height="90" fill="#23242A" rx="12" filter="url(#shadow)" stroke="#FF453A" stroke-width="2"/>
                        <text x="120" y="40" text-anchor="middle" font-family="Inter" font-weight="600" font-size="16" fill="#FF453A">Syntax Error at line 14</text>
                        <rect x="80" y="55" width="80" height="24" rx="6" fill="#FF453A"/>
                        <text x="120" y="72" text-anchor="middle" font-family="Inter" font-weight="600" font-size="12" fill="#FFFFFF">OK</text>
                    </g>
                </g>
            </g>
        </g>

        <!-- SCENE 2: The Solution -->
        <g transform="translate(0, 0)">
            <g class="scene2">
                <g transform="translate(600, 180)">
                    <text text-anchor="middle" font-family="Inter" font-weight="800" font-size="56" fill="#F8F9FA">Meet <tspan fill="#9D4DFF">Winomation</tspan></text>
                    <text text-anchor="middle" y="45" font-family="Inter" font-weight="400" font-size="24" fill="#F8F9FA" opacity="0.6">Build automations visually. Powerful node-based editor.</text>
                </g>
                
                <g transform="translate(200, 420)">
                    <!-- Connecting Nodes -->
                    <path d="M 250 45 L 400 45 L 430 155 L 500 155" fill="none" stroke="#6F00FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="flow-line"/>
                    <path d="M 400 45 L 430 -65 L 500 -65" fill="none" stroke="#343741" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8"/>
                    
                    <!-- Trigger Node -->
                    <g transform="translate(0, 0)">
                        <g class="floating-box" style="animation-delay: 0s;">
                            <rect width="250" height="90" rx="16" fill="#23242A" filter="url(#shadow)" stroke="#343741" stroke-width="2"/>
                            <rect x="0" y="0" width="12" height="90" fill="#8B949E" rx="6" clip-path="url(#node-bar)"/>
                            <text x="35" y="40" font-family="Inter" font-weight="800" font-size="18" fill="#F8F9FA">Hotkey Trigger</text>
                            <text x="35" y="65" font-family="Inter" font-size="14" fill="#9D4DFF" font-weight="600">Ctrl + Shift + O</text>
                            <!-- Connection port -->
                            <circle cx="250" cy="45" r="8" fill="#23242A" stroke="#343741" stroke-width="3"/>
                        </g>
                    </g>

                    <!-- Core Action Node -->
                    <g transform="translate(500, 110)">
                        <g class="floating-box" style="animation-delay: 0.4s;">
                            <rect width="250" height="90" rx="16" fill="#23242A" filter="url(#shadow)" stroke="#343741" stroke-width="2"/>
                            <rect x="0" y="0" width="12" height="90" fill="#6F00FF" rx="6" clip-path="url(#node-bar)"/>
                            <text x="35" y="40" font-family="Inter" font-weight="800" font-size="18" fill="#F8F9FA">Run Action</text>
                            <text x="35" y="65" font-family="Inter" font-size="14" fill="#F8F9FA" opacity="0.6">Launch Obsidian.exe</text>
                            <!-- Connection port -->
                            <circle cx="0" cy="45" r="8" fill="#23242A" stroke="#6F00FF" stroke-width="3"/>
                        </g>
                    </g>

                    <!-- Unused branch / Condition -->
                    <g transform="translate(500, -110)">
                        <g class="floating-box" style="animation-delay: 0.8s;">
                            <rect width="250" height="90" rx="16" fill="#23242A" filter="url(#shadow)" stroke="#343741" stroke-width="2" stroke-dasharray="8"/>
                            <rect x="0" y="0" width="12" height="90" fill="#343741" rx="6" clip-path="url(#node-bar)"/>
                            <text x="35" y="40" font-family="Inter" font-weight="800" font-size="18" fill="#F8F9FA" opacity="0.5">Show Notification</text>
                            <text x="35" y="65" font-family="Inter" font-size="14" fill="#F8F9FA" opacity="0.4">Condition failed</text>
                            <!-- Connection port -->
                            <circle cx="0" cy="45" r="8" fill="#23242A" stroke="#343741" stroke-width="3"/>
                        </g>
                    </g>
                </g>
            </g>
        </g>

        <!-- SCENE 3: The Demo -->
        <g transform="translate(0, 0)">
            <g class="scene3">
                <g transform="translate(600, 200)">
                    <text text-anchor="middle" font-family="Inter" font-weight="800" font-size="52" fill="#F8F9FA" letter-spacing="-1">Powerful execution at the core.</text>
                    <text text-anchor="middle" y="45" font-family="Inter" font-weight="400" font-size="24" fill="#F8F9FA" opacity="0.6">Combining native Node.js speeds with AHK UI control.</text>
                </g>

                <g transform="translate(250, 380)">
                    <!-- Technology Pillars -->
                    <!-- Node.js System -->
                    <g transform="translate(150, 0)">
                        <g class="floating-box" style="animation-delay: 0s;">
                            <circle cx="60" cy="60" r="70" fill="#23242A" filter="url(#shadow)" stroke="#6F00FF" stroke-width="2"/>
                            <!-- Abstract rings to simulate network/system -->
                            <circle cx="60" cy="60" r="85" fill="none" stroke="#343741" stroke-width="1" class="rotate-ring" stroke-dasharray="10 20"/>
                            
                            <text x="60" y="55" text-anchor="middle" font-family="Inter" font-weight="800" font-size="22" fill="#9D4DFF">Node</text>
                            <text x="60" y="80" text-anchor="middle" font-family="Inter" font-weight="600" font-size="12" fill="#F8F9FA" opacity="0.6">File &amp; System</text>
                        </g>
                    </g>
                    
                    <!-- Electron Bridge -->
                    <g transform="translate(350, 0)">
                        <g class="floating-box" style="animation-delay: 0.4s;">
                            <rect x="-10" y="-10" width="140" height="140" rx="36" fill="#23242A" filter="url(#shadow)" stroke="#8B949E" stroke-width="2"/>
                            <text x="60" y="55" text-anchor="middle" font-family="Inter" font-weight="800" font-size="22" fill="#F8F9FA">Electron</text>
                            <text x="60" y="80" text-anchor="middle" font-family="Inter" font-weight="600" font-size="12" fill="#F8F9FA" opacity="0.6">IPC Bridge</text>
                        </g>
                    </g>

                    <!-- AutoHotkey -->
                    <g transform="translate(550, 0)">
                        <g class="floating-box" style="animation-delay: 0.8s;">
                            <circle cx="60" cy="60" r="70" fill="#23242A" filter="url(#shadow)" stroke="#6F00FF" stroke-width="2"/>
                            <text x="60" y="55" text-anchor="middle" font-family="Inter" font-weight="800" font-size="22" fill="#9D4DFF">AHK</text>
                            <text x="60" y="80" text-anchor="middle" font-family="Inter" font-weight="600" font-size="12" fill="#F8F9FA" opacity="0.6">UI Control</text>
                        </g>
                    </g>

                    <!-- Connecting Links -->
                    <path d="M 230 60 L 330 60" fill="none" stroke="#343741" stroke-width="3" stroke-linecap="round" stroke-dasharray="6"/>
                    <path d="M 490 60 L 540 60" fill="none" stroke="#343741" stroke-width="3" stroke-linecap="round" stroke-dasharray="6"/>
                    
                    <!-- MITM Proxy Extra feature -->
                    <g transform="translate(350, 180)">
                        <rect x="0" y="0" width="120" height="40" rx="20" fill="#16171A" stroke="#343741" stroke-width="1.5" stroke-dasharray="4"/>
                        <text x="60" y="25" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="#8B949E">MITM Proxy</text>
                    </g>
                </g>
            </g>
        </g>

        <!-- SCENE 4: CTA and Authority -->
        <g transform="translate(0, 0)">
            <g class="scene4">
                <style>
                     @keyframes s4_press {
                         0%, 20% { transform: scale(1); }
                         25% { transform: scale(0.92); opacity: 0.8; }
                         30%, 100% { transform: scale(1); opacity: 1; }
                     }
                     @keyframes s4_toast {
                         0%, 40% { transform: translateY(40px) scale(0.9); opacity: 0; }
                         45%, 80% { transform: translateY(0) scale(1); opacity: 1; }
                         85%, 100% { transform: translateY(-20px) scale(0.9); opacity: 0; }
                     }
                     @keyframes s4_beam_dash {
                         0%, 23% { stroke-dashoffset: 400; opacity: 1; }
                         40% { stroke-dashoffset: 0; opacity: 1; }
                         50%, 100% { stroke-dashoffset: 0; opacity: 0; }
                     }
                     .s4-btn { animation: s4_press 3s infinite; transform-origin: center; }
                     .s4-popup { animation: s4_toast 3s infinite cubic-bezier(0.25, 1, 0.5, 1); transform-origin: center; }
                     .s4-line-beam { stroke-dasharray: 400; stroke-dashoffset: 400; animation: s4_beam_dash 3s infinite ease-out; }
                </style>

                <g transform="translate(600, 180)">
                    <text text-anchor="middle" font-family="Inter" font-weight="800" font-size="56" fill="#F8F9FA">Take <tspan fill="#6F00FF">Action</tspan> Instantly.</text>
                    <text text-anchor="middle" y="45" font-family="Inter" font-weight="400" font-size="24" fill="#F8F9FA" opacity="0.6">Watch workflows execute in milliseconds.</text>
                </g>

                <!-- Action Simulation -->
                <g transform="translate(420, 360)">
                    <!-- Fake Keyboard Key -->
                    <g class="s4-btn" transform="translate(-180, 20)">
                        <rect x="-70" y="-20" width="160" height="60" rx="16" fill="#23242A" stroke="#6F00FF" stroke-width="2" filter="url(#shadow)"/>
                        <circle cx="-50" cy="0" r="6" fill="#ffbd2e"/>
                        <text x="10" y="5" text-anchor="middle" font-family="Inter" font-weight="800" font-size="16" fill="#F8F9FA">Hotkey Press</text>
                    </g>
                    
                    <!-- Energy Beam -->
                    <path class="s4-line-beam" d="M -90 20 L 50 20 L 100 80 L 150 80" fill="none" stroke="#9D4DFF" stroke-width="4" stroke-linecap="round"/>

                    <!-- Receiving App / Output -->
                    <g transform="translate(300, 80)">
                        <g class="s4-popup">
                            <rect x="-140" y="-45" width="280" height="90" rx="20" fill="#23242A" stroke="#27c93f" stroke-width="2" filter="url(#shadow)"/>
                            <circle cx="-100" cy="0" r="20" fill="#27c93f" opacity="0.15"/>
                            <path d="M -110 0 L -102 8 L -90 -8" fill="none" stroke="#27c93f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            <text x="-60" y="-5" font-family="Inter" font-weight="800" font-size="20" fill="#F8F9FA">Task Completed</text>
                            <text x="-60" y="20" font-family="Inter" font-weight="600" font-size="14" fill="#F8F9FA" opacity="0.6">Workflow finished in 12ms.</text>
                        </g>
                    </g>
                </g>

                <!-- Real CTA -->
                <g transform="translate(600, 640)">
                    <g>
                        <rect x="-140" y="-35" width="280" height="70" rx="35" fill="#FF6B00" filter="url(#shadow)"/>
                        <text x="0" y="7" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#FFFFFF">Get Winomation</text>
                    </g>
                </g>
            </g>
        </g>
    </svg>
</div>

</body>
</html>
